name = "vextra-api"
main = "src/worker.ts"
compatibility_date = "2026-10-24"
workers_dev = true

# Journaux persistés (dont la ligne structurée `cron.tick` de chaque passe).
[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

# Mises à jour en direct (ADR 0006) : un Durable Object par espace.
[[durable_objects.bindings]]
name = "TENANT_LIVE_HUB"
class_name = "TenantLiveHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantLiveHub"]

# Limitation de débit (ADR 0002). Fenêtre de 60 s ; clé = scope + IP client.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PING_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Production : un seul Worker sert le SPA (assets) et l'API sous la même
# origine (ADR 0001). Les bindings ne sont pas hérités entre environnements.
[env.production]
name = "cronping"  # nom historique du Worker de production : le renommer crée un nouveau Worker (URL, secrets, Durable Object)
workers_dev = true

[env.production.assets]
directory = "../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "PING_RATE_LIMITER"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

[[env.production.durable_objects.bindings]]
name = "TENANT_LIVE_HUB"
class_name = "TenantLiveHub"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["TenantLiveHub"]
