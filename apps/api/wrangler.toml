name = "cronping-api"
main = "src/worker.ts"
compatibility_date = "2026-10-24"
workers_dev = true

[triggers]
crons = ["* * * * *"]

# Limitation de débit (ADR 0002). Fenêtre de 60 s ; clé = scope + IP client.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "PING_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
