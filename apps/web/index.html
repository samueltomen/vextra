<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CronPing surveille les heartbeats de vos scripts planifiés."
    />
    <meta name="color-scheme" content="light dark" />
    <title>CronPing</title>
    <script>
      try {
        var stored = window.localStorage.getItem('cronping.theme')
        var dark =
          stored === null ||
          stored === 'dark' ||
          (stored === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (error) {
        /* thème sombre par défaut */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
